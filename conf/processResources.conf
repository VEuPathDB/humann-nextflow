// Process CPU/memory requirements, expressed in portable Nextflow syntax (no bsub
// strings here) so this file works unchanged under any executor (LSF, Slurm, ...).
// Executor-specific submission flags belong in conf/lsf.config (or its future
// Slurm equivalent) instead.
process {
    errorStrategy = { task.exitStatus in 130..140 ? 'retry' : 'finish' }
    memory = { task.attempt > 1 ? '6 GB' : '12 GB' }
}
